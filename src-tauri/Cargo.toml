[package]
name = "keep-desktop"
version = "0.2.11"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools", "unstable"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
wry = { version = "0.57", default-features = false, features = ["os-webview", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"
winreg = "0.56"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"
glib = "0.18"
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
