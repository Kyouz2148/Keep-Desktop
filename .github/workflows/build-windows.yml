name: Build Windows Executable

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        shell: pwsh
        run: |
          if (-not (Get-Command cargo-tauri -ErrorAction SilentlyContinue)) {
            cargo install tauri-cli --version "^2.0.0" --locked
          }

      - name: Build Tauri Windows app (NSIS)
        shell: pwsh
        run: cargo tauri build

      - name: List generated binaries
        shell: pwsh
        run: |
          Get-ChildItem -Path "src-tauri/target/release/keep-desktop.exe"
          Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keep-desktop-windows
          path: |
            src-tauri/target/release/keep-desktop.exe
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: "Google Keep Desktop v0.1.0"
          generate_release_notes: true
          files: |
            src-tauri/target/release/keep-desktop.exe
            src-tauri/target/release/bundle/nsis/*.exe
