name: Build Windows Executable

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI (prebuilt)
        shell: pwsh
        run: npm install -g @tauri-apps/cli@^2

      - name: Build Tauri Windows app (NSIS)
        shell: pwsh
        run: tauri build

      - name: List generated binaries
        shell: pwsh
        run: |
          Get-ChildItem -Path "src-tauri/target/release/keep-desktop.exe"
          Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keep-desktop-windows
          path: |
            src-tauri/target/release/keep-desktop.exe
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $conf = Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json
          echo "tag=v$($conf.version)" >> $env:GITHUB_OUTPUT
          echo "version=$($conf.version)" >> $env:GITHUB_OUTPUT

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Google Keep Desktop ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: |
            src-tauri/target/release/keep-desktop.exe
            src-tauri/target/release/bundle/nsis/*.exe
